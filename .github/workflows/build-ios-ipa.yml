name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ios-ipa.yml"
      - "AppleApp/**"
      - "native-core/**"
      - "shared/**"
      - "vendor/innertubex/**"
      - "scripts/build-native-core.sh"
      - "scripts/build-shared-framework.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Compile and package unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      JAVA_TOOL_OPTIONS: "-Xmx3g"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g"
      CONFIG: release
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust with Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install Apple build dependencies
        run: |
          brew install xcodegen cmake
          xcodebuild -version
          xcodegen --version
          cargo --version
          cmake --version
          java -version

      - name: Build Kotlin shared framework
        run: CONFIG=release bash scripts/build-shared-framework.sh

      - name: Build Rust native framework and Swift bindings
        run: bash scripts/build-native-core.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec AppleApp/project.yml

      - name: Build for physical iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project AppleApp/BitChord.xcodeproj \
            -scheme BitChord \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BitChordDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BitChordDerivedData/Build/Products/Release-iphoneos/BitChord.app"
          if [ ! -f "$APP/BitChord" ]; then
            echo "::error::Expected iOS executable not found: $APP/BitChord"
            exit 1
          fi
          mkdir -p dist/Payload
          ditto "$APP" dist/Payload/BitChord.app
          (
            cd dist
            zip -qry BitChord-unsigned.ipa Payload
          )
          unzip -t dist/BitChord-unsigned.ipa > /dev/null
          echo "IPA size:"
          du -h dist/BitChord-unsigned.ipa

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-iOS-unsigned
          path: dist/BitChord-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
